name: Build iOS IPA & Android APK

on:
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual di GitHub

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Prepare Clean Workspace
        run: |
          mkdir -p "$RUNNER_TEMP/flutter_app"
          cp -R "./Mobile App Flutter/Halo APU mobile/." "$RUNNER_TEMP/flutter_app/"
          mkdir -p "$RUNNER_TEMP/flutter_app/build/ios/SourcePackages"

      - name: Configure Flutter & Get Dependencies
        working-directory: ${{ runner.temp }}/flutter_app
        run: |
          flutter config --no-enable-swift-package-manager
          flutter config --no-analytics
          flutter pub get

      - name: Install CocoaPods Dependencies
        working-directory: ${{ runner.temp }}/flutter_app/ios
        run: pod install --repo-update

      - name: Build iOS Application (No Codesign)
        working-directory: ${{ runner.temp }}/flutter_app
        run: flutter build ios --release --no-codesign

      - name: Package Payload to IPA
        working-directory: ${{ runner.temp }}/flutter_app
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r -q HaloAPU-iOS.ipa Payload
          cd ../../..
          cp build/ios/iphoneos/HaloAPU-iOS.ipa "${{ github.workspace }}/HaloAPU-iOS.ipa"

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaloAPU-iOS-IPA
          path: ${{ github.workspace }}/HaloAPU-iOS.ipa

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: './Mobile App Flutter/Halo APU mobile'
        run: flutter pub get

      - name: Build Android APK
        working-directory: './Mobile App Flutter/Halo APU mobile'
        run: flutter build apk --debug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaloAPU-Android-APK
          path: Mobile App Flutter/Halo APU mobile/build/app/outputs/flutter-apk/app-debug.apk
