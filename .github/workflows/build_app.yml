name: Build iOS IPA & Android APK

on:
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual di GitHub

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: './Mobile App Flutter/Halo APU mobile'
        run: flutter pub get

      - name: Build iOS (No Codesign)
        working-directory: './Mobile App Flutter/Halo APU mobile'
        run: flutter build ios --release --no-codesign

      - name: Create Payload & IPA
        working-directory: './Mobile App Flutter/Halo APU mobile'
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r HaloAPU-iOS.ipa Payload
          cd ../../..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaloAPU-iOS
          path: Mobile App Flutter/Halo APU mobile/build/ios/iphoneos/HaloAPU-iOS.ipa

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: './Mobile App Flutter/Halo APU mobile'
        run: flutter pub get

      - name: Build Android APK
        working-directory: './Mobile App Flutter/Halo APU mobile'
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaloAPU-Android-APK
          path: Mobile App Flutter/Halo APU mobile/build/app/outputs/flutter-apk/app-release.apk
